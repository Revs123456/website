<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — TechChampsByRev</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #312e81 50%, #7c3aed 100%);
      color: #fff; padding: 24px;
    }
    .card {
      max-width: 420px; text-align: center;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 40px 28px;
      backdrop-filter: blur(10px);
    }
    .emoji { font-size: 56px; line-height: 1; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.02em; }
    p { font-size: 14px; opacity: 0.8; margin: 0 0 24px; line-height: 1.6; }
    button {
      padding: 12px 28px; border-radius: 10px; border: none;
      background: #fff; color: #0f172a; font-weight: 700; cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📡</div>
    <h1>You're offline</h1>
    <p>
      The internet is being shy. Check your connection and we'll get you back to your dashboard.
    </p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
