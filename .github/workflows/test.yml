name: Test Suite

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend-test:
    name: Backend (Jest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tech_career_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/tech_career_hub_test?schema=public
      JWT_SECRET: ci-test-jwt-secret-not-for-production-use-only
      RAZORPAY_KEY_ID: rzp_test_dummy_key_id
      RAZORPAY_KEY_SECRET: rzp_test_dummy_key_secret
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations against the test database
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm test -- --coverage

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 14

      - name: Publish backend test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend test results
          path: backend/coverage/junit.xml
          reporter: jest-junit

  frontend-test:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:cov
        env:
          CI: true

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

      - name: Publish frontend test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Frontend test results
          path: frontend/coverage/junit.xml
          reporter: java-junit
