name: Test Suite

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# This repo's default Actions token permission is read-only, which silently
# stops dorny/test-reporter from publishing its check-run report (the step
# still exits 0). Grant checks:write explicitly so the per-test report
# actually gets created.
permissions:
  contents: read
  checks: write

jobs:
  backend-test:
    name: Backend (Jest)
    runs-on: ubuntu-latest

    # NOTE: no Postgres service / prisma migrate / e2e step here — the tracked
    # migration history in prisma/migrations cannot currently be replayed
    # against a fresh database (20260517000000_add_site_user depends on the
    # otp_codes table, which only exists via the untracked prisma/otp_migration.sql
    # raw SQL script). Unit tests below mock Prisma entirely, so they don't
    # need a real database. Re-add a postgres service + `prisma migrate deploy`
    # + `npm run test:e2e` once that migration gap is fixed.
    env:
      JWT_SECRET: ci-test-jwt-secret-not-for-production-use-only
      RAZORPAY_KEY_ID: rzp_test_dummy_key_id
      RAZORPAY_KEY_SECRET: rzp_test_dummy_key_secret
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit tests
        run: npm test -- --coverage

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 14

      - name: Publish backend test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend test results
          path: backend/coverage/junit.xml
          reporter: jest-junit

  frontend-test:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:cov
        env:
          CI: true

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

      - name: Publish frontend test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Frontend test results
          path: frontend/coverage/junit.xml
          reporter: java-junit
